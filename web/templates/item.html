<div class="item-swipe-wrapper">
  <div class="swipe-bg swipe-bg-right">✓ Bought</div>
  <div class="swipe-bg swipe-bg-left">🗑 Delete</div>
  <div class="item {{if .Bought}}bought{{end}}"
       data-delete-url="/items/{{.ID}}"
       data-toggle-url="/items/{{.ID}}/toggle">
    <span class="item-name">{{.Name}}</span>
    <span class="item-date">{{.CreatedAt.Format "Jan 2, 2006"}}</span>
  </div>
</div>
